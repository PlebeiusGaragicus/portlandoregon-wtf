name: deploy-pages

# Only main deploys. Day-to-day work happens on dev; a PR merged into main is
# what publishes. workflow_dispatch is the manual re-deploy escape hatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Publishing belongs to the abvstudio fork; this repo is where the game is
    # developed and has Pages disabled. Without this guard every push to main
    # here would fail on the deploy step and train us to ignore red builds.
    if: github.repository == 'abvstudio-net/portlandoregon-wtf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stage the map
        # The city is a ~30 MB release asset, not a git object. Without this the
        # site deploys but has no map to load.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAP_REPO: PlebeiusGaragicus/portlandoregon-wtf
        run: ./scripts/stage-map.sh --download

      - name: Build client
        # Only the WebSocket uses this — the map is a static asset, so the
        # published build needs no server. Baked in at build time; override with
        # a VITE_SERVER_ORIGIN repo variable when the game server moves. Unset
        # means same-origin, which is correct for the spectator-only build.
        env:
          VITE_SERVER_ORIGIN: ${{ vars.VITE_SERVER_ORIGIN }}
        run: npm run build -w client

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist

  deploy:
    needs: build
    if: github.repository == 'abvstudio-net/portlandoregon-wtf'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
