name: ci

# Validates without publishing: every PR aimed at main, plus direct pushes to
# dev. Make this a required status check on main so a client that doesn't even
# build can't reach the deploy workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces

      - name: Test full-city overview
        run: |
          npm run test:overview-atlas
          npm run test:overview-symbols
          npm run test:camera
          npm run test:apparatus
          npm run test:staged-map-gate

      - name: Build client
        # Same origin the deploy job bakes in, so CI exercises the real Pages
        # build rather than a same-origin variant that only works locally.
        env:
          VITE_SERVER_ORIGIN: ${{ vars.VITE_SERVER_ORIGIN }}
        run: npm run build -w client
