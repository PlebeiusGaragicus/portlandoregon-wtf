<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>portlandoregon.wtf</title>
    <!-- The loading backdrop is the first thing painted, and it is the only
         image on the critical path — fetch it alongside the module script
         rather than after the CSS that references it. -->
    <link rel="preload" as="image" href="./loading-city-v1.webp" />
    <!-- Installable, so the city survives WebKit's 7-day sweep of
         script-writable storage: a Home Screen web app is outside Safari and
         gets its own days-of-use counter. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portland, OR" />
    <meta name="description" content="Portland, Oregon, rendered in a browser." />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #0d1014;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game > canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #1d222b;
        cursor: grab;
        touch-action: none;
      }
      #hudclock {
        position: fixed;
        left: 0.9rem;
        top: 0.8rem;
        padding: 0.3rem 0.65rem;
        border-radius: 8px;
        background: rgba(16, 19, 25, 0.62);
        color: #c8d0dd;
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        cursor: pointer;
        user-select: none;
        z-index: 4;
      }
      #hudclock:hover { background: rgba(34, 41, 54, 0.85); }
      #hudscale {
        position: fixed;
        left: 0.9rem;
        bottom: 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        pointer-events: none;
        z-index: 4;
        color: #b9c2d0;
        font-size: 0.75rem;
        letter-spacing: 0.03em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      #hudscale .bar {
        height: 4px;
        border: 1px solid rgba(210, 220, 235, 0.85);
        border-top: none;
        box-sizing: border-box;
      }
      #modefade {
        position: fixed;
        inset: 0;
        background: #14171c;
        opacity: 0;
        pointer-events: none;
        z-index: 7;
      }
      #fpvhint {
        position: fixed;
        left: 50%;
        bottom: 2.2rem;
        transform: translateX(-50%);
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        background: rgba(16, 19, 25, 0.78);
        color: #c8d0dd;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 6;
        white-space: nowrap;
      }
      #fpvhint.show { opacity: 1; }
      #marquee {
        position: fixed;
        border: 1px solid rgba(255, 216, 79, 0.9);
        background: rgba(255, 216, 79, 0.12);
        pointer-events: none;
        z-index: 5;
      }
      #minimap {
        position: fixed;
        right: 0.9rem;
        bottom: 0.9rem;
        width: 200px !important; /* beats the inline backing size */
        height: auto !important;
        transition: width 0.22s ease, opacity 0.15s ease;
        opacity: 0.82;
        border-radius: 10px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        z-index: 4;
      }
      #minimap:hover {
        opacity: 0.97;
        width: 520px !important;
      }
      #compass {
        position: fixed;
        right: 1.1rem;
        top: 1.1rem;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 50%;
        background: rgba(20, 23, 28, 0.75);
        border: 1px solid #3a4150;
        cursor: pointer;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #compass span {
        display: block;
        color: #ffd84f;
        font-weight: 700;
        font-size: 0.95rem;
        transform: rotate(var(--rot, 0rad));
        transition: none;
      }
      #compass span::after {
        content: "";
        display: block;
        margin: 0 auto;
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-bottom: 7px solid #ffd84f;
        position: relative;
        top: -1.55rem;
      }
      /* Loading overlay: the city you are waiting for, with the boot log
         floating straight on top of it — no panel, no box. The spinner
         animates on the compositor, so it keeps turning even while the main
         thread chews through map geometry. */
      #loading {
        position: fixed;
        inset: 0;
        background: #0d1014;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0.7rem;
        padding: 1.5rem 1.1rem 1.1rem;
        box-sizing: border-box;
        overflow: hidden;
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      /* The backdrop is its own layer for two reasons: it can be darkened
         without dimming the text over it, and the flat colour behind it shows
         through for the frame or two before the image decodes. Negative
         z-index paints it above #loading's own background but below content. */
      #loading::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background: url("./loading-city-v1.webp") center / cover no-repeat;
        /* A bright, dense aerial at full strength turns every street line into
           competition for the log text. */
        filter: brightness(0.85) saturate(0.95);
      }
      /* Scrim, heaviest at the top where the wordmark and the newest lines sit
         and easing off lower down so the city stays legible as an image. */
      #loading::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          to bottom,
          rgba(8, 10, 14, 0.66) 0%,
          rgba(8, 10, 14, 0.26) 45%,
          rgba(8, 10, 14, 0.5) 100%
        );
      }
      /* Boot console: a cold load takes tens of seconds and can die partway,
         so every step is printed rather than hidden behind one status line.
         Monospace, scrolling, dmesg-ish — the log IS the bug report, which
         matters most on a phone where there is no devtools. */
      #bootlog {
        width: min(100%, 62rem);
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        color: #b3bece;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.72rem;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        -webkit-overflow-scrolling: touch;
        /* Nothing but shadow separates the text from the city now. */
        text-shadow: 0 1px 5px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.75);
        /* Older lines dissolve into the image as they scroll up rather than
           being clipped by an edge that no longer exists. */
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 24%);
        scrollbar-width: none;
      }
      #bootlog::-webkit-scrollbar { display: none; }
      /* Lines arrive rather than snapping in — the log is the only motion on
         screen for most of a cold load. */
      #bootlog > div { animation: linein 0.45s ease both; }
      @keyframes linein {
        from { opacity: 0; transform: translateY(0.35rem); }
        to { opacity: 1; transform: none; }
      }
      #bootlog .l-ok { color: #7fd487; }
      #bootlog .l-warn { color: #f0b45c; }
      #bootlog .l-fail { color: #ff7d70; }
      #bootbar {
        width: min(100%, 62rem);
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-wrap: wrap;
      }
      #bootbar h1 { flex: 1 1 auto; }
      #bootbar button {
        font: inherit;
        font-size: 0.75rem;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        border: 1px solid rgba(230, 238, 250, 0.2);
        background: rgba(10, 13, 18, 0.5);
        color: #cdd6e4;
        cursor: pointer;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      #bootbar button:hover { background: rgba(30, 38, 50, 0.75); }
      /* The log is a bug report, and a bug report is only worth offering when
         there is a bug. A healthy boot shows nothing but the city. */
      #copylog { display: none; }
      #loading.offline #copylog,
      #loading.crashed #copylog { display: inline-block; }
      /* A boot that died and came back needs the verdict up top, not buried
         in the scrollback. */
      #bootcrash {
        display: none;
        width: min(100%, 62rem);
        box-sizing: border-box;
        padding: 0.65rem 0.8rem;
        border: 1px solid rgba(186, 90, 78, 0.55);
        border-radius: 10px;
        background: rgba(38, 21, 19, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #f0b3ab;
        font-size: 0.82rem;
        line-height: 1.5;
      }
      #bootcrash.show { display: block; }
      #bootcrash code {
        display: block;
        margin-top: 0.4rem;
        font-size: 0.72rem;
        color: #f6cec9;
        overflow-wrap: anywhere;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      /* Offline state: the spinner would otherwise keep turning forever behind
         an error nobody can act on. */
      #loading.offline .spin { display: none; }
      #loading.offline #loading-status { color: #f0b45c; }
      #offline {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        max-width: 32rem;
        padding: 1.1rem 1.3rem;
        border-radius: 12px;
        background: rgba(10, 13, 18, 0.66);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-align: center;
      }
      #loading.offline #offline { display: flex; }
      #offline p { margin: 0; color: #b3bece; font-size: 0.9rem; line-height: 1.5; }
      #offline button {
        font: inherit;
        font-size: 0.9rem;
        padding: 0.5rem 1.2rem;
        border-radius: 8px;
        border: 1px solid rgba(230, 238, 250, 0.24);
        background: rgba(30, 38, 50, 0.8);
        color: #e6e6e6;
        cursor: pointer;
      }
      #offline button:hover { background: rgba(46, 56, 72, 0.9); }
      #offline button:disabled { opacity: 0.5; cursor: default; }
      #offline button:focus-visible { outline: 2px solid #ffd84f; outline-offset: 2px; }
      #loading .spin {
        width: 1.15rem;
        height: 1.15rem;
        flex: none;
        border-radius: 50%;
        border: 2px solid rgba(230, 238, 250, 0.22);
        border-top-color: #ffd84f;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading h1 {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(1.05rem, 3.6vw, 1.45rem);
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #f2f5fa;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
      }
      #loading-status {
        width: min(100%, 62rem);
        margin: 0;
        color: #cbd4e2;
        font-size: 0.9rem;
        min-height: 1.2em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
      }
      /* Add-to-Home-Screen hint. iOS offers no install prompt API, so the
         only way anyone discovers that this can be installed is being told.
         Shown once, to repeat visitors, on the one platform where installing
         changes anything material. */
      #install {
        position: fixed;
        left: 50%;
        bottom: 1.4rem;
        transform: translate(-50%, 1rem);
        display: none;
        align-items: center;
        gap: 0.7rem;
        max-width: min(92vw, 30rem);
        padding: 0.7rem 0.75rem 0.7rem 0.95rem;
        /* Not a pill: the text wraps to three or four lines on a narrow
           phone, and a 999px radius turns that into an ellipse. */
        border-radius: 0.85rem;
        border: 1px solid rgba(230, 238, 250, 0.16);
        background: rgba(13, 16, 20, 0.86);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #cdd6e4;
        font-size: 0.82rem;
        line-height: 1.35;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.35s ease, transform 0.35s ease;
        z-index: 8;
      }
      #install.show { display: flex; opacity: 1; transform: translate(-50%, 0); }
      #install b { color: #f2f5fa; font-weight: 600; }
      #install button {
        font: inherit;
        flex: none;
        width: 1.7rem;
        height: 1.7rem;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(230, 238, 250, 0.18);
        background: transparent;
        color: #9aa4b5;
        cursor: pointer;
      }
      #install button:hover { color: #e6e6e6; }
      @media (prefers-reduced-motion: reduce) {
        #bootlog > div { animation: none; }
        #loading .spin { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="canvas"></canvas>
    </div>
    <div id="loading">
      <div id="bootbar">
        <div class="spin"></div>
        <h1>portlandoregon.wtf</h1>
        <button id="copylog" type="button">Copy log</button>
      </div>
      <p id="loading-status">loading the city…</p>
      <div id="bootcrash">
        <strong id="bootcrash-title"></strong>
        <span id="bootcrash-detail"></span>
        <code id="bootcrash-line"></code>
      </div>
      <div id="bootlog"></div>
      <div id="offline">
        <p id="offline-detail"></p>
        <button id="retry" type="button">Try again</button>
      </div>
    </div>
    <div id="install">
      <span>Keep the city downloaded — <b>Share</b> &rsaquo; <b>Add to Home Screen</b>.</span>
      <button id="install-dismiss" type="button" aria-label="Dismiss">&times;</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
