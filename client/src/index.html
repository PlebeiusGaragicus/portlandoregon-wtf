<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Juice</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #14171c;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #game > canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #1d222b;
        cursor: grab;
        touch-action: none;
      }
      #hudclock {
        position: fixed;
        left: 0.9rem;
        top: 0.8rem;
        padding: 0.3rem 0.65rem;
        border-radius: 8px;
        background: rgba(16, 19, 25, 0.62);
        color: #c8d0dd;
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        cursor: pointer;
        user-select: none;
        z-index: 4;
      }
      #hudclock:hover { background: rgba(34, 41, 54, 0.85); }
      #hudscale {
        position: fixed;
        left: 0.9rem;
        bottom: 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        pointer-events: none;
        z-index: 4;
        color: #b9c2d0;
        font-size: 0.75rem;
        letter-spacing: 0.03em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      #hudscale .bar {
        height: 4px;
        border: 1px solid rgba(210, 220, 235, 0.85);
        border-top: none;
        box-sizing: border-box;
      }
      #modefade {
        position: fixed;
        inset: 0;
        background: #14171c;
        opacity: 0;
        pointer-events: none;
        z-index: 7;
      }
      #fpvhint {
        position: fixed;
        left: 50%;
        bottom: 2.2rem;
        transform: translateX(-50%);
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        background: rgba(16, 19, 25, 0.78);
        color: #c8d0dd;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 6;
        white-space: nowrap;
      }
      #fpvhint.show { opacity: 1; }
      #marquee {
        position: fixed;
        border: 1px solid rgba(255, 216, 79, 0.9);
        background: rgba(255, 216, 79, 0.12);
        pointer-events: none;
        z-index: 5;
      }
      #minimap {
        position: fixed;
        right: 0.9rem;
        bottom: 0.9rem;
        width: 200px !important; /* beats the inline backing size */
        height: auto !important;
        transition: width 0.22s ease, opacity 0.15s ease;
        opacity: 0.82;
        border-radius: 10px;
        box-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        z-index: 4;
      }
      #minimap:hover {
        opacity: 0.97;
        width: 520px !important;
      }
      #compass {
        position: fixed;
        right: 1.1rem;
        top: 1.1rem;
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 50%;
        background: rgba(20, 23, 28, 0.75);
        border: 1px solid #3a4150;
        cursor: pointer;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #compass span {
        display: block;
        color: #ffd84f;
        font-weight: 700;
        font-size: 0.95rem;
        transform: rotate(var(--rot, 0rad));
        transition: none;
      }
      #compass span::after {
        content: "";
        display: block;
        margin: 0 auto;
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-bottom: 7px solid #ffd84f;
        position: relative;
        top: -1.55rem;
      }
      /* Loading overlay: the spinner animates on the compositor, so it keeps
         turning even while the main thread chews through map geometry. */
      #loading {
        position: fixed;
        inset: 0;
        background: #14171c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      /* Offline state: the spinner would otherwise keep turning forever behind
         an error nobody can act on. */
      #loading.offline .spin { display: none; }
      #loading.offline #loading-status { color: #e0a044; }
      #offline { display: none; flex-direction: column; align-items: center; gap: 0.9rem; max-width: 30rem; text-align: center; }
      #loading.offline #offline { display: flex; }
      #offline p { margin: 0; color: #9aa4b5; font-size: 0.9rem; line-height: 1.5; }
      #offline button {
        font: inherit;
        font-size: 0.9rem;
        padding: 0.5rem 1.2rem;
        border-radius: 8px;
        border: 1px solid #3a4150;
        background: #222936;
        color: #e6e6e6;
        cursor: pointer;
      }
      #offline button:hover { background: #2c3444; }
      #offline button:disabled { opacity: 0.5; cursor: default; }
      #offline button:focus-visible { outline: 2px solid #4f7cff; outline-offset: 2px; }
      #retry-note { font-variant-numeric: tabular-nums; min-height: 1.2em; }
      #loading .spin {
        width: 3rem;
        height: 3rem;
        border-radius: 50%;
        border: 4px solid #2a303c;
        border-top-color: #4f7cff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.04em; }
      #loading-status { margin: 0; color: #9aa4b5; font-size: 0.9rem; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <div id="game">
      <canvas id="canvas"></canvas>
    </div>
    <div id="loading">
      <div class="spin"></div>
      <h1>Battle Juice</h1>
      <p id="loading-status">loading the city…</p>
      <div id="offline">
        <p id="offline-detail"></p>
        <button id="retry" type="button">Try again</button>
        <p id="retry-note"></p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
