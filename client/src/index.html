<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Juice</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        background: #14171c;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      #join {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 18rem;
      }
      #join h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
      #join input {
        padding: 0.5rem;
        border-radius: 6px;
        border: 1px solid #3a4150;
        background: #1d222b;
        color: inherit;
      }
      #join button {
        padding: 0.55rem;
        border-radius: 6px;
        border: none;
        background: #4f7cff;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      #join .error { color: #ff7a7a; min-height: 1.2em; margin: 0; }
      #game { display: none; }
      #game canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #1d222b;
        cursor: crosshair;
        touch-action: none;
      }
      #banner {
        position: fixed;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        padding: 0.8rem 2rem;
        border-radius: 12px;
        background: rgba(20, 23, 28, 0.9);
        border: 1px solid #3a4150;
        color: #ffd84f;
        font-size: 1.6rem;
        font-weight: 700;
        display: none;
        pointer-events: none;
        white-space: nowrap;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 0.75rem;
        transform: translateX(-50%);
        padding: 0.3rem 0.8rem;
        border-radius: 999px;
        background: rgba(20, 23, 28, 0.75);
        color: #9aa4b5;
        font-size: 0.8rem;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <form id="join">
      <h1>Battle Juice</h1>
      <input id="name" placeholder="Your name" maxlength="24" autocomplete="nickname" />
      <input id="password" type="password" placeholder="Game password" />
      <button type="submit">Join</button>
      <p class="error" id="error"></p>
    </form>
    <div id="game">
      <canvas id="canvas"></canvas>
      <div id="banner"></div>
      <div id="hint">click squad to select &middot; click street to move &middot; drag/WASD pan &middot; wheel zoom &middot; Q/E rotate</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
